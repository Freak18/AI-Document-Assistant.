services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-workbench-db
    environment:
      POSTGRES_DB: ai_workbench
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-dotenv}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ai_workbench"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

